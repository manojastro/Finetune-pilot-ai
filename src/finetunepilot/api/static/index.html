<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FineTunePilot runs</title>
<style>
  :root { --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70; --line: #e3e3e6; --accent: #2457c5; --warn: #9a6700; --bad: #b42318; --good: #1a7f37; --panel: #f6f6f8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #ececef; --muted: #9a9aa2; --line: #2c2c31; --accent: #7aa2ff; --warn: #e3b341; --bad: #ff7b72; --good: #56d364; --panel: #1c1c20; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  form { display: grid; gap: 8px; }
  input, button { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  ul.sessions { list-style: none; margin: 0; padding: 0; }
  ul.sessions li { padding: 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
  ul.sessions li:hover, ul.sessions li.active { background: var(--panel); }
  .id { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); }
  .completed { color: var(--good); } .failed { color: var(--bad); } .running, .queued { color: var(--warn); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .report h1 { font-size: 17px; } .report h2 { font-size: 15px; margin-top: 16px; } .report h3 { font-size: 14px; }
  .report blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--panel); }
  code { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  td code { white-space: nowrap; overflow-wrap: normal; }  /* long run ids: scroll the table instead */
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header><h1>FineTunePilot</h1><span>run history</span></header>
<main>
  <section>
    <div class="panel">
      <h2>Start a dry-run session</h2>
      <form id="start">
        <input name="objective" value="Pick the right tool with exact JSON arguments" aria-label="Objective" required>
        <input name="max_runs" type="number" min="1" max="10" value="3" aria-label="Max runs">
        <button type="submit">Start (dry run)</button>
        <span class="muted" id="start-msg"></span>
      </form>
    </div>
    <h2>Sessions</h2>
    <ul class="sessions" id="sessions"><li class="muted">Loading…</li></ul>
  </section>
  <section id="detail"><p class="muted">Select a session.</p></section>
</main>
<script>
// Everything shown comes from the API; text is escaped before any markup is added.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v) => v === null || v === undefined ? "not measured" : (typeof v === "number" ? v.toFixed(4) : esc(v));
let current = null;

function inline(s) {  // input is already escaped
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function markdown(md) {  // tiny renderer: headings, quotes, lists, tables, paragraphs
  const out = []; let table = null;
  const flush = () => { if (table) { out.push('<div class="scroll"><table>' + table.join("") + "</table></div>"); table = null; } };
  for (const raw of md.split("\n")) {
    const line = esc(raw);
    if (/^\|.*\|$/.test(raw.trim())) {
      if (/^\|[\s|:-]+\|$/.test(raw.trim())) continue;
      const cells = line.trim().slice(1, -1).split("|").map((c) => inline(c.trim()));
      const tag = table ? "td" : "th"; table = table || [];
      table.push("<tr>" + cells.map((c) => `<${tag}>${c}</${tag}>`).join("") + "</tr>"); continue;
    }
    flush();
    let m;
    if ((m = line.match(/^(#{1,3}) (.*)$/))) out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
    else if (line.startsWith("&gt; ")) out.push(`<blockquote>${inline(line.slice(5))}</blockquote>`);
    else if (line.startsWith("- ")) out.push(`<div>• ${inline(line.slice(2))}</div>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  flush(); return out.join("\n");
}

async function loadSessions() {
  const list = document.getElementById("sessions");
  try {
    const sessions = await (await fetch("sessions")).json();
    if (!sessions.length) { list.innerHTML = '<li class="muted">No sessions yet.</li>'; return; }
    list.innerHTML = sessions.map((s) => `
      <li data-id="${esc(s.session_id)}" class="${s.session_id === current ? "active" : ""}">
        <div class="id">${esc(s.session_id)}</div>
        <span class="badge ${esc(s.status)}">${esc(s.status)}</span>
        ${s.dry_run ? '<span class="badge">dry run</span>' : ""}
        <span class="muted">${s.runs} runs · best args_exact ${fmt(s.best_args_exact_match)}</span>
        <div class="muted">${esc(s.objective)}</div>
      </li>`).join("");
    list.querySelectorAll("li[data-id]").forEach((li) => li.onclick = () => showSession(li.dataset.id));
  } catch (e) { list.innerHTML = `<li class="failed">Could not load sessions: ${esc(e)}</li>`; }
}

async function showSession(id) {
  current = id; loadSessions();
  const box = document.getElementById("detail");
  const res = await fetch("sessions/" + encodeURIComponent(id));
  if (!res.ok) { box.innerHTML = `<p class="failed">Session not found.</p>`; return; }
  const { session, report_markdown } = await res.json();
  const runs = session.runs || [];
  const rows = runs.map((r) => {
    const m = r.metrics || {};
    const links = [r.train_run_id, r.eval_run_id].filter(Boolean)
      .map((rid) => `<a href="runs/${encodeURIComponent(rid)}" target="_blank" rel="noopener"><code>${esc(rid)}</code></a>`).join("<br>");
    return `<tr><td>${r.index}</td><td>${esc(r.train_status)}</td><td>${(r.attempts || []).length}</td>
      <td>${fmt((r.train_metrics || {}).final_loss)}</td><td>${fmt(m.json_valid)}</td>
      <td>${fmt(m.tool_name_accuracy)}</td><td>${fmt(m.args_exact_match)}</td><td>${links}</td></tr>`;
  }).join("");
  const base = (session.baseline || {}).metrics || {};
  box.innerHTML = `
    <div class="panel">
      <h2>Session <span class="id">${esc(id)}</span> <span class="badge ${esc(session.status)}">${esc(session.status)}</span></h2>
      <div class="muted">Last step: ${esc(session.last_node)} · ${esc(session.stop_reason || session.error || "")}</div>
      ${(session.settings || {}).dry_run ? '<p class="muted">Dry run: numbers are simulated, not measurements.</p>' : ""}
      <div class="scroll"><table>
        <tr><th>run</th><th>train</th><th>attempts</th><th>final loss</th><th>json_valid</th><th>tool_name_acc</th><th>args_exact</th><th>run logs</th></tr>
        <tr><td>base</td><td>-</td><td>-</td><td>-</td><td>${fmt(base.json_valid)}</td><td>${fmt(base.tool_name_accuracy)}</td><td>${fmt(base.args_exact_match)}</td><td></td></tr>
        ${rows}
      </table></div>
    </div>
    <div class="panel report">${report_markdown ? markdown(report_markdown) : '<p class="muted">No report yet.</p>'}</div>`;
}

document.getElementById("start").onsubmit = async (ev) => {
  ev.preventDefault();
  const form = new FormData(ev.target), msg = document.getElementById("start-msg");
  msg.textContent = "Starting…";
  const res = await fetch("sessions", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ objective: form.get("objective"), max_runs: Number(form.get("max_runs")), dry_run: true }) });
  const body = await res.json();
  msg.textContent = res.ok ? `Started ${body.session_id}` : `Error: ${body.detail}`;
  if (res.ok) { current = body.session_id; setTimeout(() => showSession(body.session_id), 1500); }
  loadSessions();
};
loadSessions();
setInterval(() => { loadSessions(); if (current) showSession(current); }, 5000);
</script>
</body>
</html>
